<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>互动纠正组件测试</title><style>body{margin:30px auto;padding:0 18px;max-width:1050px;font-family:system-ui;background:#eef2fc;color:#263451}h1{font-size:26px}.fixture{padding:12px;background:#fff5d7;border-radius:12px}</style></head><body><h1>互动纠正组件测试</h1><p class="fixture">此页为模拟数据，不连接生产后台。</p><div id="app"></div><script type="module">
import {createApp,h,ref} from 'vue'
import Panel from '../../src/components/InteractionLearningPanel.vue'
const base=(id,question,kind,extra)=>({id,tenant_id:14,room_id:8,question,original_reply:'',source_type:'initial_simulation',status:'editing',created_by_user_id:1,created_at:'2026-10-09',updated_at:'2026-10-09',review:{plan_id:4,kind,meaning:'食品包装选择',context:'杨鸭子食品包装',reason:'短问法需要解释',suggested_rule:'包装场景的抽指抽真空；不抽可以吗是询问非真空包装能否选择；抽奖场景不适用。',needed_facts:[],occurrences:1,...extra}})
let rows=[base(1,'不抽可以吗？','semantic',{}),base(2,'江油好久到？','missing_fact',{meaning:'江油到货时效',context:'介绍京东物流',reason:'未提供江油运输时效',suggested_rule:'',needed_facts:['江油运输时效']})]
window.fixtureCalls=[]
window.fetch=async(url,init={})=>{
 const path=String(url),method=init.method||'GET';window.fixtureCalls.push({path,method})
 let result={}
 if(path.includes('interaction-learning/simulate')){rows.push(base(3,'抽气没？','semantic',{}));result={generated:1}}
 else if(path.includes('/interaction-learning/')&&path.endsWith('/close')){const id=Number(path.split('/').at(-2));rows=rows.filter(x=>x.id!==id);result={closed:true}}
 else if(path.includes('interaction-learning')){result={items:rows,pending_count:rows.length}}
 else if(path.endsWith('/turns')){const id=Number(path.split('/').at(-2));const feedback=JSON.parse(init.body).feedback;result={session:rows.find(x=>x.id===id),result:{id:100,session_id:id,evidence_id:1,turn_no:1,memory_type:feedback.includes('默认抽真空')?'fact':'semantic',target:'包装问法',memory_key:'packaging',result_text:feedback,created_at:'2026-10-09'}}}
 else if(path.endsWith('/adopt')){const id=Number(path.split('/').at(-2));rows=rows.filter(x=>x.id!==id);result={}}
 else return new Response(JSON.stringify({error:'意外测试请求'}),{status:500,headers:{'Content-Type':'application/json'}})
 return new Response(JSON.stringify(result),{status:200,headers:{'Content-Type':'application/json'}})
}
createApp({setup(){const room=ref(8),plan=ref(4);return()=>h('div',[h(Panel,{roomId:room.value,planId:plan.value,onOpenFacts:()=>{document.querySelector('.fixture').textContent='已收到跳转事实依据请求'},onAdopted:()=>{document.querySelector('.fixture').textContent='已收到刷新已采用规则请求'}})])}}).mount('#app')
</script></body></html>
